[workspace]
resolver = "2"
members = ["crates/crateshift-core", "crates/crateshift-render", "crates/crateshift-kindle", "crates/crateshift-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
crateshift-core = { path = "crates/crateshift-core" }
crateshift-render = { path = "crates/crateshift-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
